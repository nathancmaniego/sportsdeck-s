services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sportsdeck
    ports:
      - "8008:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/sportsdeck
      JWT_SECRET: 4473f0c2fb3379ebdedb6db7c9ec828e42d20119dd2cf6ff1e5ba872a698ea2f
      FOOTBALL_DATA_API_KEY: 1e36bb976f61413281ce841fb3522e97
      HUGGINGFACE_API_KEY: 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

volumes:
  postgres_data: